name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate tag matches app version
        shell: pwsh
        run: |
          $version = (Select-String -Path genesis/__init__.py -Pattern 'APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME ne correspond pas à APP_VERSION=$version"
          }

      - name: Install CUDA build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cuda.txt
          python -m pip install pyinstaller

      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_engine.py
          python tests/test_optimizations.py
          python tests/test_generator.py
          python tests/test_update.py
          python tests/test_packaging_spec.py

      - name: Build Genesis Studio (one-folder)
        run: python -m PyInstaller --noconfirm --clean genesis.spec

      - name: Build isolated updater helper
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name GenesisUpdater --distpath dist/updater tools/updater_helper.py

      - name: Include updater helper and create full ZIP
        run: |
          Copy-Item "dist/updater/GenesisUpdater.exe" "dist/Genesis Studio/GenesisUpdater.exe"
          python tools/create_full_bundle.py --source "dist/Genesis Studio" --output "dist/GenesisStudio-Windows-x64-full.zip"

      - name: Download previous full bundle and create differential patch
        id: previous
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path update | Out-Null
          python tools/fetch_previous_bundle.py `
            --repo latroupeyt-debug/GenesisStudio `
            --current-tag $env:GITHUB_REF_NAME `
            --output update/previous `
            --tag-file update/previous-tag.txt
          $code = $LASTEXITCODE
          if ($code -eq 3) {
            "has_previous=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($code -ne 0) { exit $code }
          $previousTag = Get-Content update/previous-tag.txt -Raw
          python tools/build_update_patch.py `
            --current "dist/Genesis Studio" `
            --previous "update/previous/Genesis Studio" `
            --from $previousTag.Trim() `
            --to $env:GITHUB_REF_NAME `
            --out "dist/GenesisStudio-Windows-x64-update.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "has_previous=true" >> $env:GITHUB_OUTPUT

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $files = @("dist/GenesisStudio-Windows-x64-full.zip")
          if ("${{ steps.previous.outputs.has_previous }}" -eq "true") {
            $files += "dist/GenesisStudio-Windows-x64-update.zip"
          }
          "files<<EOF" >> $env:GITHUB_OUTPUT
          $files | ForEach-Object { $_ >> $env:GITHUB_OUTPUT }
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.assets.outputs.files }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
